---
name: Code Linting

on:
  pull_request:
    branches:
      - main

permissions: read-all

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Remove previous Super-linter PR comments
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          echo "Looking for previous Super-linter comments on PR #${PR_NUMBER}"

          comment_ids="$(
            gh api \
              "repos/${REPO}/issues/${PR_NUMBER}/comments" \
              --paginate \
              --jq '.[]
                | select(.user.type == "Bot")
                | select(.body | contains("Powered by [Super-linter]"))
                | .id'
          )"

          if [ -z "${comment_ids}" ]; then
            echo "No previous Super-linter comments found."
            exit 0
          fi

          echo "${comment_ids}" | while read -r comment_id; do
            [ -z "${comment_id}" ] && continue

            echo "Deleting Super-linter comment ${comment_id}"

            gh api \
              --method DELETE \
              "repos/${REPO}/issues/comments/${comment_id}"
          done

      - name: Super-linter
        uses: super-linter/super-linter/slim@9e863354e3ff62e0727d37183162c4a88873df41 # v8.6.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: false
          VALIDATE_CHECKOV: false
          VALIDATE_JSCPD: false
          VALIDATE_BIOME_FORMAT: false
          VALIDATE_BIOME_LINT: false
          VALIDATE_TRIVY: false
          VALIDATE_SPELL_CODESPELL: false
          SUPPRESS_POSSUM: true
          LINTER_RULES_PATH: /
          DISABLE_ERRORS: true
          SAVE_SUPER_LINTER_SUMMARY: true
          FAIL_ON_INVALID_GITHUB_ACTIONS_EVENT_CONFIGURATION: true
          NO_COLOR: "1"
          FORCE_COLOR: "0"
          TERM: dumb

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e #v6.4.0
        with:
          node-version: 22

      - name: Install CSpell
        run: |
          npm install --no-audit --no-fund --no-save \
            cspell \
            @cspell/dict-fr-fr

      - name: Find changed Markdown files
        id: changed_markdown
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail

          git fetch --no-tags --prune --depth=1 origin \
            "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"

          git diff \
            --name-only \
            --diff-filter=ACMR \
            "origin/${BASE_REF}...HEAD" \
            -- 'docs/**/*.md' \
            > changed-markdown-files.txt

          echo "Changed Markdown files:"
          cat changed-markdown-files.txt

          if [ -s changed-markdown-files.txt ]; then
            echo "has_changed_markdown=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changed_markdown=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run CSpell on changed Markdown files
        if: steps.changed_markdown.outputs.has_changed_markdown == 'true'
        run: |
          npx cspell \
            --config cspell.json \
            --no-progress \
            --show-suggestions \
            --file-list changed-markdown-files.txt
