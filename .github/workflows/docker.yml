name: Build, push to GitHub Container Registry, and deploy
on:
  push:
    branches:
      - main

env:
  DOCKER_SLUG: ghcr.io/ssc-sp/fsdh-pfds-docs

permissions:
  contents: read    # required for actions/checkout
  packages: write   # required to push to GitHub Container Registry (ghcr.io)

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build and push
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

    - name: Set up QEMU
      uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push image to ghcr.io
      uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
      with:
        context: .
        file: Dockerfile
        push: true
        tags: |
          ghcr.io/ssc-sp/fsdh-pfds-docs:latest
          ghcr.io/ssc-sp/fsdh-pfds-docs:${{ github.sha }}
        cache-from: type=registry,ref=ghcr.io/ssc-sp/fsdh-pfds-docs:latest
        cache-to: type=inline
