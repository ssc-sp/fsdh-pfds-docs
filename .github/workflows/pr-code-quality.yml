---
name: Code Quality

on:
  pull_request:
    branches:
      - main

permissions: read-all

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Remove previous Super-linter PR comments
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          echo "Looking for previous Super-linter comments on PR #${PR_NUMBER}"

          comment_ids="$(
            gh api \
              "repos/${REPO}/issues/${PR_NUMBER}/comments" \
              --paginate \
              --jq '.[]
                | select(.user.type == "Bot")
                | select(.body | contains("Powered by [Super-linter]"))
                | .id'
          )"

          if [ -z "${comment_ids}" ]; then
            echo "No previous Super-linter comments found."
            exit 0
          fi

          echo "${comment_ids}" | while read -r comment_id; do
            [ -z "${comment_id}" ] && continue

            echo "Deleting Super-linter comment ${comment_id}"

            gh api \
              --method DELETE \
              "repos/${REPO}/issues/comments/${comment_id}"
          done

      - name: Super-linter
        uses: super-linter/super-linter/slim@9e863354e3ff62e0727d37183162c4a88873df41 # v8.6.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: false
          VALIDATE_CHECKOV: false
          VALIDATE_JSCPD: false
          VALIDATE_BIOME_FORMAT: false
          VALIDATE_BIOME_LINT: false
          VALIDATE_TRIVY: false
          VALIDATE_SPELL_CODESPELL: false
          SUPPRESS_POSSUM: true
          LINTER_RULES_PATH: /
          DISABLE_ERRORS: true
          SAVE_SUPER_LINTER_SUMMARY: true
          FAIL_ON_INVALID_GITHUB_ACTIONS_EVENT_CONFIGURATION: true
          NO_COLOR: "1"
          FORCE_COLOR: "0"
          TERM: dumb

  spelling:
    name: Spelling
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Install CSpell
        run: |
          npm install --no-audit --no-fund --no-save \
            cspell \
            @cspell/dict-fr-fr

      - name: Find changed Markdown files
        id: changed_markdown
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail

          git fetch --no-tags --prune --depth=1 origin \
            "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"

          git diff \
            --name-only \
            --diff-filter=ACMR \
            "origin/${BASE_REF}...HEAD" \
            -- 'docs/**/*.md' \
            > changed-markdown-files.txt

          echo "Changed Markdown files:"
          cat changed-markdown-files.txt

          if [ -s changed-markdown-files.txt ]; then
            echo "has_changed_markdown=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changed_markdown=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Remove previous CSpell PR comments
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          comment_marker="<!-- cspell-summary-identifier -->"

          echo "Looking for previous CSpell comments on PR #${PR_NUMBER}"

          comment_ids="$(
            gh api \
              "repos/${REPO}/issues/${PR_NUMBER}/comments" \
              --paginate \
              --jq ".[] | select(.user.type == \"Bot\") | select(.body | contains(\"${comment_marker}\")) | .id"
          )"

          if [ -z "${comment_ids}" ]; then
            echo "No previous CSpell comments found."
            exit 0
          fi

          echo "${comment_ids}" | while read -r comment_id; do
            [ -z "${comment_id}" ] && continue

            echo "Deleting CSpell comment ${comment_id}"

            gh api \
              --method DELETE \
              "repos/${REPO}/issues/comments/${comment_id}"
          done

      - name: Run CSpell on changed Markdown files
        id: cspell
        if: steps.changed_markdown.outputs.has_changed_markdown == 'true'
        run: |
          set +e

          npx cspell \
            --config cspell.json \
            --no-progress \
            --show-suggestions \
            --file-list changed-markdown-files.txt \
            > cspell-output.txt 2>&1

          cspell_exit_code="$?"

          set -e

          cat cspell-output.txt

          echo "exit_code=${cspell_exit_code}" >> "$GITHUB_OUTPUT"

      - name: Create or update CSpell PR comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HAS_CHANGED_MARKDOWN: ${{ steps.changed_markdown.outputs.has_changed_markdown }}
          CSPELL_EXIT_CODE: ${{ steps.cspell.outputs.exit_code || '0' }}
        run: |
          set -euo pipefail

          comment_marker="<!-- cspell-summary-identifier -->"

          existing_comment_id="$(
            gh api \
              "repos/${REPO}/issues/${PR_NUMBER}/comments" \
              --paginate \
              --jq ".[] | select(.user.type == \"Bot\") | select(.body | contains(\"${comment_marker}\")) | .id" \
              | head -n 1
          )"

          if [ "${HAS_CHANGED_MARKDOWN}" != "true" ]; then
            echo "No changed Markdown files found."

            if [ -n "${existing_comment_id}" ]; then
              echo "Deleting stale CSpell comment ${existing_comment_id}"

              gh api \
                --method DELETE \
                "repos/${REPO}/issues/comments/${existing_comment_id}"
            fi

            exit 0
          fi

          if [ "${CSPELL_EXIT_CODE}" = "0" ]; then
            result="Pass ✅"
          else
            result="Fail ❌"
          fi

          files_checked="$(
            wc -l < changed-markdown-files.txt | tr -d ' '
          )"

          cspell_summary="$(
            grep -E 'Files checked:|Issues found:' cspell-output.txt || true
          )"

          comment_body="$(mktemp)"

          {
            echo "${comment_marker}"
            echo "# CSpell summary"
            echo ""
            echo "| Check | Validation result |"
            echo "| --- | --- |"
            echo "| MARKDOWN_SPELLING | ${result} |"
            echo ""
            echo "Files checked: ${files_checked}"
            echo ""
            if [ -n "${cspell_summary}" ]; then
              echo "${cspell_summary}"
              echo ""
            fi

            echo "<details>"
            echo "<summary>Changed Markdown files</summary>"
            echo ""
            echo '```text'
            cat changed-markdown-files.txt
            echo '```'
            echo ""
            echo "</details>"
            echo ""

            echo "<details>"
            echo "<summary>CSpell output</summary>"
            echo ""
            echo '```text'
            sed -n '1,200p' cspell-output.txt
            echo '```'
            echo ""
            echo "</details>"
            echo ""
            echo "Powered by CSpell"
          } > "${comment_body}"

          if [ -n "${existing_comment_id}" ]; then
            echo "Updating existing CSpell comment ${existing_comment_id}"

            jq -n --rawfile body "${comment_body}" '{body: $body}' \
              | gh api \
                  --method PATCH \
                  "repos/${REPO}/issues/comments/${existing_comment_id}" \
                  --input -
          else
            echo "Creating new CSpell comment"

            jq -n --rawfile body "${comment_body}" '{body: $body}' \
              | gh api \
                  --method POST \
                  "repos/${REPO}/issues/${PR_NUMBER}/comments" \
                  --input -
          fi

      - name: Fail if CSpell found issues
        if: steps.changed_markdown.outputs.has_changed_markdown == 'true' && steps.cspell.outputs.exit_code != '0'
        run: |
          echo "CSpell found spelling issues."
          exit 1
