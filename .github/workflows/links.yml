name: Links

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  
permissions:
  issues: write # Required for the issue creation step

jobs:
  linkChecker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # Targets "." to scan your real project files.
          # Switched to "--format detailed" and added "--exclude canada.ca".
          args: >-
            --insecure
            --verbose
            --format detailed
            --accept 200
            --base-url "/workspaces/fsdh-pfds-docs/docs"
            --fallback-extensions md,mdx
            --exclude "file:///"
            --exclude "\.(pdf|zip|png|jpg)$"
            --exclude "sharepoint.com"
            --exclude "localhost:"
            --exclude "127.0.0.1"
            --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
            .
          fail: false 

      - name: Create Issue From File
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: Link Checker Report
          content-filepath: ./lychee/out.md
          labels: report, automated issue
