name: Links

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  
permissions:
  contents: read
  pull-requests: write

jobs:
  linkChecker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # Targets "." to scan your real project files.
          # Switched to "--format detailed" and added "--exclude canada.ca".
          # Note: '--base-url' is changed to '--base' to support newer lychee versions.
          args: >-
            -vvv
            --insecure
            --verbose
            --format detailed
            --accept 200..=308
            --max-redirects 15
            --base "/workspaces/fsdh-pfds-docs/docs"
            --fallback-extensions md,mdx
            --exclude "file:///"
            --exclude "\.(pdf|zip|png|jpg)$"
            --exclude "localhost:"
            --exclude "127.0.0.1"
            --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
            .
          fail: false 

      - name: Format Comment Body
        if: github.event_name == 'pull_request' && steps.lychee.outputs.exit_code != 0
        run: |
          {
            echo "# Link Checker summary"
            echo ""
            echo "| Check | Validation result |"
            echo "| --- | --- |"
            echo "| LINK_CHECKER | Fail ❌ |"
            echo ""
            echo "<details open>"
            echo "<summary>Link Checker report</summary>"
            echo ""
            cat ./lychee/out.md
            echo ""
            echo "</details>"
            echo ""
            echo "Powered by Lychee"
          } > ./lychee/comment.md

      - name: Comment on PR
        if: github.event_name == 'pull_request' && steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-path: ./lychee/comment.md
